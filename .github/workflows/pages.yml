name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mid-semester releases: 15 February and 15 September. GitHub uses UTC.
    - cron: '23 4 15 2,9 *'
    # API keepalive only; no timetable refresh, build or deployment.
    - cron: '13 4 1 * *'

permissions:
  contents: read

concurrency:
  group: pages
  # Let an active deployment finish; the newest pending run follows it.
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || github.event.schedule == '23 4 15 2,9 *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Conditional requests reuse PDFs that have not changed.
      - uses: actions/cache@v4
        with:
          path: .cache/fjfi
          key: fjfi-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fjfi-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Refresh bachelor and master timetables and program choices
        run: npm run sync-fjfi
      - name: Refresh OCR lecturers and rooms
        run: npm run update-names
      - name: Refresh OCR course codes
        run: npm run update-courses
      - name: Recognize and validate all official timetables
        run: npm run preprocess-fjfi
      - run: npm test
      # Pages serves the site under /<repo name>/; derive it so renames cannot break asset URLs.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # A manual run on a feature branch validates the build without publishing it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # GitHub disables schedules in public repos after 60 days without activity.
  # Renew the workflow via its API, without dummy commits or a personal token.
  # Runs monthly between semesters, independently of any build/deploy.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/enable"
